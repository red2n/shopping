<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart - Online Supermarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- Mobile Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <!-- Logo -->
                <div class="flex items-center space-x-2">
                    <i class="fas fa-shopping-basket text-green-600 text-2xl"></i>
                    <h1 class="text-xl md:text-2xl font-bold text-gray-800">FreshMart</h1>
                </div>

                <!-- Mobile Menu Toggle -->
                <button id="menuToggle" class="lg:hidden text-gray-600 hover:text-gray-800">
                    <i class="fas fa-bars text-2xl"></i>
                </button>

                <!-- Desktop Actions -->
                <div class="hidden lg:flex items-center space-x-6">
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Search products..."
                               class="w-64 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                        <i class="fas fa-search absolute right-3 top-3 text-gray-400"></i>
                    </div>
                    <button id="cartBtn" class="relative text-gray-600 hover:text-green-600">
                        <i class="fas fa-shopping-cart text-2xl"></i>
                        <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
                    </button>
                </div>
            </div>

            <!-- Mobile Search -->
            <div class="mt-3 lg:hidden">
                <div class="relative">
                    <input type="text" id="searchInputMobile" placeholder="Search products..."
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    <i class="fas fa-search absolute right-3 top-3 text-gray-400"></i>
                </div>
            </div>
        </div>

        <!-- Mobile Navigation Menu -->
        <nav id="mobileMenu" class="hidden lg:hidden bg-white border-t">
            <ul class="py-2">
                <li><a href="#" class="block px-4 py-3 hover:bg-gray-100" data-category="all">All Products</a></li>
                <li><a href="#" class="block px-4 py-3 hover:bg-gray-100" data-category="fruits">Fruits</a></li>
                <li><a href="#" class="block px-4 py-3 hover:bg-gray-100" data-category="vegetables">Vegetables</a></li>
                <li><a href="#" class="block px-4 py-3 hover:bg-gray-100" data-category="dairy">Dairy</a></li>
                <li><a href="#" class="block px-4 py-3 hover:bg-gray-100" data-category="bakery">Bakery</a></li>
                <li><a href="#" class="block px-4 py-3 hover:bg-gray-100" data-category="beverages">Beverages</a></li>
                <li><a href="#" class="block px-4 py-3 hover:bg-gray-100" data-category="snacks">Snacks</a></li>
            </ul>
        </nav>
    </header>

    <!-- Desktop Category Navigation -->
    <nav class="hidden lg:block bg-white shadow-sm sticky top-[73px] z-40">
        <div class="container mx-auto px-4">
            <ul class="flex space-x-6 overflow-x-auto">
                <li><a href="#" class="block py-4 px-2 text-gray-700 hover:text-green-600 border-b-2 border-transparent hover:border-green-600 whitespace-nowrap font-medium" data-category="all">All Products</a></li>
                <li><a href="#" class="block py-4 px-2 text-gray-700 hover:text-green-600 border-b-2 border-transparent hover:border-green-600 whitespace-nowrap" data-category="fruits">Fruits</a></li>
                <li><a href="#" class="block py-4 px-2 text-gray-700 hover:text-green-600 border-b-2 border-transparent hover:border-green-600 whitespace-nowrap" data-category="vegetables">Vegetables</a></li>
                <li><a href="#" class="block py-4 px-2 text-gray-700 hover:text-green-600 border-b-2 border-transparent hover:border-green-600 whitespace-nowrap" data-category="dairy">Dairy</a></li>
                <li><a href="#" class="block py-4 px-2 text-gray-700 hover:text-green-600 border-b-2 border-transparent hover:border-green-600 whitespace-nowrap" data-category="bakery">Bakery</a></li>
                <li><a href="#" class="block py-4 px-2 text-gray-700 hover:text-green-600 border-b-2 border-transparent hover:border-green-600 whitespace-nowrap" data-category="beverages">Beverages</a></li>
                <li><a href="#" class="block py-4 px-2 text-gray-700 hover:text-green-600 border-b-2 border-transparent hover:border-green-600 whitespace-nowrap" data-category="snacks">Snacks</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6">
        <!-- Category Title -->
        <div class="mb-6">
            <h2 id="categoryTitle" class="text-2xl md:text-3xl font-bold text-gray-800">All Products</h2>
            <p class="text-gray-600 mt-1" id="productCount">Loading products...</p>
        </div>

        <!-- Products Grid -->
        <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-4">
            <!-- Products will be loaded here dynamically -->
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <i class="fas fa-spinner fa-spin text-4xl text-green-600"></i>
            <p class="mt-4 text-gray-600">Loading products...</p>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-12">
            <i class="fas fa-box-open text-6xl text-gray-300"></i>
            <p class="mt-4 text-xl text-gray-600">No products found</p>
        </div>
    </main>

    <!-- Mobile Cart Button (Fixed) -->
    <button id="cartBtnMobile" class="lg:hidden fixed bottom-4 right-4 bg-green-600 text-white rounded-full h-14 w-14 shadow-lg hover:bg-green-700 flex items-center justify-center z-50">
        <i class="fas fa-shopping-cart text-xl"></i>
        <span id="cartCountMobile" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-6 w-6 flex items-center justify-center">0</span>
    </button>

    <!-- Shopping Cart Modal -->
    <div id="cartModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50">
        <div class="fixed inset-y-0 right-0 w-full sm:w-96 bg-white shadow-xl transform transition-transform duration-300">
            <div class="flex flex-col h-full">
                <!-- Cart Header -->
                <div class="flex items-center justify-between p-4 border-b">
                    <h3 class="text-xl font-bold text-gray-800">Shopping Cart</h3>
                    <button id="closeCart" class="text-gray-600 hover:text-gray-800">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>

                <!-- Cart Items -->
                <div id="cartItems" class="flex-1 overflow-y-auto p-4">
                    <!-- Cart items will be loaded here -->
                </div>

                <!-- Cart Footer -->
                <div class="border-t p-4 bg-gray-50">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-lg font-semibold text-gray-800">Total:</span>
                        <span id="cartTotal" class="text-2xl font-bold text-green-600">$0.00</span>
                    </div>
                    <button class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">
                        Checkout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
